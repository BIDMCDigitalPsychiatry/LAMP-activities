<!DOCTYPE html>
<html>
<head>
  <title>MemoryGame Test Harness</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f0f0; }
    #controls { background: #333; color: #fff; font-size: 14px; }
    #controls .row { padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #controls .row-harness { border-bottom: 1px solid #444; }
    #controls .row-activity { background: #2a2a2a; }
    #controls button { padding: 6px 14px; cursor: pointer; border: none; border-radius: 4px; font-size: 13px; }
    #controls .btn-send { background: #359FFE; color: #fff; }
    #controls .btn-toggle { background: #555; color: #fff; }
    #controls .btn-clear { background: #777; color: #fff; }
    #controls select, #controls input { padding: 5px 8px; border-radius: 4px; border: 1px solid #555; background: #444; color: #fff; font-size: 13px; }
    #controls input[type="number"] { width: 50px; }
    #controls label { font-size: 12px; color: #aaa; }
    #main { display: flex; height: calc(100vh - 80px); }
    #game-panel { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; overflow: auto; }
    #game-panel iframe { width: 100%; height: 100%; border: none; }
    /* Device preview mode */
    #game-panel.device-preview { background: #e0e0e0; }
    #game-panel.device-preview iframe {
      width: var(--device-w);
      height: var(--device-h);
      border-radius: 36px;
      box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #333, 0 8px 30px rgba(0,0,0,0.4);
      flex-shrink: 0;
      transform: scale(var(--device-scale, 1));
      transform-origin: center center;
    }

    /* ─── Data Panel ─── */
    #data-panel { width: 420px; background: #1e1e1e; color: #d4d4d4; font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; display: flex; flex-direction: column; border-left: 2px solid #444; }
    #data-panel.hidden { display: none; }
    #data-panel .tab-bar { display: flex; background: #2d2d2d; border-bottom: 1px solid #444; flex-shrink: 0; }
    #data-panel .tab { padding: 8px 16px; cursor: pointer; color: #888; font-size: 12px; border-bottom: 2px solid transparent; }
    #data-panel .tab.active { color: #fff; border-bottom-color: #359FFE; }
    #data-panel .tab-content { flex: 1; overflow-y: auto; padding: 12px; }

    /* ─── Score Cards ─── */
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .score-card { background: #2a2a2a; border-radius: 6px; padding: 10px 12px; }
    .score-card.full { grid-column: 1 / -1; }
    .score-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 4px; }
    .score-value { font-size: 20px; font-weight: 700; color: #fff; }
    .score-value.highlight { color: #4fc3f7; }
    .score-value.muted { color: #888; font-size: 16px; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #333; }

    /* ─── JSON Viewer ─── */
    pre.json-view { white-space: pre-wrap; word-break: break-word; margin: 0; line-height: 1.5; }
    .json-key { color: #9cdcfe; }
    .json-string { color: #ce9178; }
    .json-number { color: #b5cea8; }
    .json-bool { color: #569cd6; }
    .json-null { color: #569cd6; }

    /* ─── Log ─── */
    #log-panel { flex: 1; overflow-y: auto; padding: 12px; }
    .log-entry { padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; color: #888; }
    .log-entry .log-time { color: #666; }
    .log-entry .log-msg { color: #0f0; }

    .no-data { color: #666; text-align: center; padding: 40px 20px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="controls">
    <div class="row row-harness">
      <strong>MemoryGame Test Harness</strong>
      <label>Port:
        <select id="port-select">
          <option value="3000" selected>3000</option>
          <option value="3001">3001</option>
          <option value="3002">3002</option>
        </select>
      </label>
      <label>Device:
        <select id="device-select">
          <option value="desktop">Desktop</option>
          <option value="375x812">iPhone SE/13 mini</option>
          <option value="390x844">iPhone 14</option>
          <option value="430x932">iPhone 14 Pro Max</option>
          <option value="360x800">Android (360)</option>
          <option value="768x1024">iPad Mini</option>
        </select>
      </label>
      <button class="btn-send" onclick="reloadActivity()">Reload</button>
      <button class="btn-toggle" onclick="togglePanel()">Toggle Data</button>
      <button class="btn-clear" onclick="clearData()">Clear</button>
    </div>
    <div class="row row-activity" id="activity-controls">
      <label>Foils:
        <select id="foils-select">
          <option value="1">1 (3 images)</option>
          <option value="2" selected>2 (4 images)</option>
        </select>
      </label>
      <label>Encoding Trials:
        <input type="number" id="encoding-trials" value="3" min="1" max="10">
      </label>
      <label>Anim Interval (s):
        <input type="number" id="anim-interval" value="2" min="1" max="10" step="0.5">
      </label>
      <label>Anim Persist (s):
        <input type="number" id="anim-persist" value="1" min="0.5" max="5" step="0.5">
      </label>
      <label>Retrieval Delay (min):
        <input type="number" id="retrieval-delay" value="1" min="0" max="30" step="0.5">
      </label>
      <label>Language:
        <select id="lang-select">
          <option value="en-US" selected>en-US</option>
          <option value="da-DK">da-DK</option>
          <option value="de-DE">de-DE</option>
          <option value="es-ES">es-ES</option>
          <option value="fr-FR">fr-FR</option>
          <option value="hi-IN">hi-IN</option>
          <option value="it-IT">it-IT</option>
          <option value="ko-KR">ko-KR</option>
          <option value="zh-CN">zh-CN</option>
          <option value="zh-HK">zh-HK</option>
        </select>
      </label>
      <button class="btn-send" onclick="sendConfig()">Send Config</button>
    </div>
  </div>
  <div id="main">
    <div id="game-panel">
      <iframe id="game" src="http://localhost:3000"></iframe>
    </div>
    <div id="data-panel">
      <div class="tab-bar">
        <div class="tab active" data-tab="scores">Scores</div>
        <div class="tab" data-tab="slices">Temporal Slices</div>
        <div class="tab" data-tab="raw">Raw JSON</div>
        <div class="tab" data-tab="log">Log</div>
      </div>
      <div class="tab-content" id="tab-scores">
        <div class="no-data">Waiting for game results...</div>
      </div>
      <div class="tab-content" id="tab-slices" style="display:none">
        <div class="no-data">Waiting for game results...</div>
      </div>
      <div class="tab-content" id="tab-raw" style="display:none">
        <div class="no-data">Waiting for game results...</div>
      </div>
      <div class="tab-content" id="tab-log" style="display:none">
        <div id="log-panel"></div>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════
    // MemoryGame Test Harness
    //
    // The activity expects config via postMessage with:
    //   - configuration.language (locale string)
    //   - activity.settings.foils (1 or 2)
    //   - activity.settings.encoding_trials (number of learning rounds)
    //   - activity.settings.animation_interval (seconds per image display)
    //   - activity.settings.animation_persistance (seconds image stays visible)
    //   - activity.settings.retrieval_delay (minutes before recall phase)
    //   - noBack (boolean)
    //   - forward (boolean)
    //
    // Boxes.tsx parses: props.data.activity.settings ?? props.data.settings
    // Board receives: foils, encodingTrials, animationInterval,
    //   animationPersistance, seqLength (derived from foils), retrievalDelay
    // ═══════════════════════════════════════════════════════════════════

    var lastResult = null;

    // ─── Iframe / PostMessage ─────────────────────────────────
    function getIframe() {
      return document.getElementById('game');
    }

    function sendConfig() {
      var lang = document.getElementById('lang-select').value;
      var foils = parseInt(document.getElementById('foils-select').value, 10);
      var encodingTrials = parseInt(document.getElementById('encoding-trials').value, 10) || 3;
      var animInterval = parseFloat(document.getElementById('anim-interval').value) || 2;
      var animPersist = parseFloat(document.getElementById('anim-persist').value) || 1;
      var retrievalDelay = parseFloat(document.getElementById('retrieval-delay').value) || 1;

      var config = {
        configuration: { language: lang },
        activity: {
          settings: {
            foils: foils,
            encoding_trials: encodingTrials,
            animation_interval: animInterval,
            animation_persistance: animPersist,
            retrieval_delay: retrievalDelay
          }
        },
        noBack: false,
        forward: true
      };
      getIframe().contentWindow.postMessage(config, '*');
      log('Sent config: foils=' + foils + ', encoding_trials=' + encodingTrials +
          ', anim_interval=' + animInterval + 's, anim_persist=' + animPersist + 's' +
          ', retrieval_delay=' + retrievalDelay + 'min, lang=' + lang);
    }

    function reloadActivity() {
      var port = document.getElementById('port-select').value;
      var iframe = getIframe();
      iframe.src = 'http://localhost:' + port;
      log('Reloading activity on port ' + port);
    }

    window.addEventListener('message', function(e) {
      if (e.source !== getIframe().contentWindow) return;
      var data;
      try {
        data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      } catch (err) {
        log('Non-JSON message: ' + String(e.data).substring(0, 100));
        return;
      }
      // Accept results that have temporal_slices, static_data, or navigation flags
      if (!data.temporal_slices && !data.static_data && !data.forward && !data.clickBack) {
        log('Non-result message: ' + JSON.stringify(data).substring(0, 100));
        return;
      }
      lastResult = data;
      log('Game result received' + (data.clickBack ? ' (back nav)' : data.forward ? ' (forward nav)' : ''));
      renderScoresTab(data);
      renderSlicesTab(data);
      renderRawTab(data);
    });

    document.getElementById('game').addEventListener('load', function() {
      log('iframe loaded, sending config...');
      sendConfig();
    });

    document.getElementById('port-select').addEventListener('change', function() {
      reloadActivity();
    });

    // ─── Scores Tab ───────────────────────────────────────────
    function renderScoresTab(data) {
      var s = data.static_data || {};
      var slices = data.temporal_slices || [];

      // Filter out manual_exit entries for analysis
      var responses = slices.filter(function(e) { return e.type !== 'manual_exit'; });

      // Compute metrics from temporal slices
      var correctTaps = responses.filter(function(e) { return e.type === true; }).length;
      var wrongTaps = responses.filter(function(e) { return e.type === false; }).length;
      var totalTaps = responses.length;
      var avgResponseTime = totalTaps > 0
        ? Math.round(responses.reduce(function(sum, e) { return sum + (e.duration || 0); }, 0) / totalTaps)
        : 0;

      // Derive score percentage
      var scorePercent = totalTaps > 0 ? Math.round(correctTaps / totalTaps * 100) : 0;

      // Use static_data values if available (they are the authoritative source)
      var encodingScore = s['total_learning/encoding_points'] !== undefined
        ? s['total_learning/encoding_points']
        : (s.encoding_score !== undefined ? s.encoding_score : '—');
      var recallScore = s['total_recall/recall_points'] !== undefined
        ? s['total_recall/recall_points']
        : (s.recall_score !== undefined ? s.recall_score : '—');
      var recallTime = s.time_of_recall_phase !== undefined
        ? (s.time_of_recall_phase / 1000).toFixed(1) + 's'
        : '—';

      var html = '';

      // Game Info
      html += sectionTitle('Game Info');
      html += '<div class="score-grid">';
      var durationKey = data['duration/total_time_taken'] !== undefined
        ? 'duration/total_time_taken' : 'duration';
      var durationMs = data[durationKey];
      if (durationMs !== undefined) html += scoreCard('Duration', (durationMs / 1000).toFixed(1) + 's', true);
      html += scoreCard('Done', data.done ? 'Yes' : (data.clickBack ? 'Back' : 'No'), false);
      html += '</div>';

      // Performance
      html += sectionTitle('Performance');
      html += '<div class="score-grid">';
      html += scoreCard('Overall Accuracy', scorePercent + '%', true, true);
      html += scoreCard('Encoding Score', encodingScore, true);
      html += scoreCard('Recall Score', recallScore, true);
      html += scoreCard('Correct Taps', s.correct_answers !== undefined ? s.correct_answers : correctTaps, true);
      html += scoreCard('Wrong Taps', s.wrong_answers !== undefined ? s.wrong_answers : wrongTaps, true);
      html += scoreCard('Total Items', s.total_questions || totalTaps, false);
      html += scoreCard('Avg Response', avgResponseTime + 'ms', false);
      html += scoreCard('Recall Phase Time', recallTime, false);
      html += scoreCard('Point', s.point !== undefined ? s.point : '—', false);
      html += '</div>';

      // Time per encoding trial
      var timeTaken = s.time_taken_for_each_trial || s['time_taken_for_each_trial'];
      if (timeTaken && typeof timeTaken === 'object') {
        html += sectionTitle('Time Per Encoding Trial');
        html += '<div class="score-grid">';
        Object.keys(timeTaken).forEach(function(trial) {
          html += scoreCard('Trial ' + trial, (timeTaken[trial] / 1000).toFixed(1) + 's', false);
        });
        html += '</div>';
      }

      // Per-level breakdown from temporal slices
      var byLevel = {};
      responses.forEach(function(r) {
        var lvl = r.level !== undefined ? r.level : '?';
        if (!byLevel[lvl]) byLevel[lvl] = { correct: 0, wrong: 0, total: 0, totalTime: 0 };
        byLevel[lvl].total++;
        byLevel[lvl].totalTime += (r.duration || 0);
        if (r.type === true) byLevel[lvl].correct++;
        else byLevel[lvl].wrong++;
      });

      var levelKeys = Object.keys(byLevel);
      if (levelKeys.length > 0) {
        html += sectionTitle('By Trial / Level');
        html += '<table style="width:100%; border-collapse:collapse; font-size:11px;">';
        html += '<thead><tr style="color:#888; border-bottom:1px solid #444;">';
        html += '<th style="padding:4px; text-align:left;">Trial</th>';
        html += '<th style="padding:4px; text-align:center;">Correct</th>';
        html += '<th style="padding:4px; text-align:center;">Wrong</th>';
        html += '<th style="padding:4px; text-align:center;">Accuracy</th>';
        html += '<th style="padding:4px; text-align:center;">Avg Time</th>';
        html += '</tr></thead><tbody>';
        levelKeys.forEach(function(lvl) {
          var l = byLevel[lvl];
          var acc = l.total > 0 ? Math.round(l.correct / l.total * 100) : 0;
          var avgT = l.total > 0 ? Math.round(l.totalTime / l.total) : 0;
          html += '<tr style="border-bottom:1px solid #2a2a2a;">';
          html += '<td style="padding:4px; color:#4fc3f7;">' + lvl + '</td>';
          html += '<td style="padding:4px; text-align:center; color:#4caf50;">' + l.correct + '</td>';
          html += '<td style="padding:4px; text-align:center; color:#e57373;">' + l.wrong + '</td>';
          html += '<td style="padding:4px; text-align:center;">' + acc + '%</td>';
          html += '<td style="padding:4px; text-align:center;">' + avgT + 'ms</td>';
          html += '</tr>';
        });
        html += '</tbody></table>';
      }

      // Target sequence info
      if (s.target_sequence) {
        html += sectionTitle('Target Sequence');
        html += '<pre class="json-view" style="font-size:11px;">' + syntaxHighlight(JSON.stringify(s.target_sequence, null, 2)) + '</pre>';
      }

      // Questionnaire
      if (s.questionnaire) {
        html += sectionTitle('Questionnaire');
        html += '<div class="score-grid">';
        html += scoreCard('Clarity', s.questionnaire.clarity + ' / 5', true);
        html += scoreCard('Happiness', s.questionnaire.happiness + ' / 5', true);
        html += '</div>';
      }

      document.getElementById('tab-scores').innerHTML = html;
    }

    // ─── Temporal Slices Tab ──────────────────────────────────
    function renderSlicesTab(data) {
      var slices = data.temporal_slices;
      if (!slices || slices.length === 0) {
        document.getElementById('tab-slices').innerHTML = '<div class="no-data">No temporal slices</div>';
        return;
      }

      var html = '<table style="width:100%; border-collapse:collapse; font-size:11px;">';
      html += '<thead><tr style="color:#888; text-align:left; border-bottom:1px solid #444;">';
      html += '<th style="padding:4px">#</th>';
      html += '<th style="padding:4px">Item</th>';
      html += '<th style="padding:4px">Trial</th>';
      html += '<th style="padding:4px">Correct</th>';
      html += '<th style="padding:4px">Location</th>';
      html += '<th style="padding:4px">Time</th>';
      html += '</tr></thead><tbody>';

      slices.forEach(function(entry, i) {
        if (entry.type === 'manual_exit') {
          html += '<tr style="color:#666; border-top:1px solid #444;"><td colspan="6" style="padding:4px">Exit (back: ' + entry.value + ')</td></tr>';
          return;
        }
        var isCorrect = entry.type === true;
        html += '<tr style="border-bottom:1px solid #2a2a2a;">';
        html += '<td style="padding:4px; color:#666;">' + (i + 1) + '</td>';
        html += '<td style="padding:4px; color:#4fc3f7; font-weight:700;">' + (entry.item !== undefined ? entry.item : '—') + '</td>';
        html += '<td style="padding:4px;">' + (entry.level !== undefined ? entry.level : '—') + '</td>';
        html += '<td style="padding:4px; color:' + (isCorrect ? '#4caf50' : '#e57373') + ';">' + (typeof entry.type === 'boolean' ? (isCorrect ? 'Yes' : 'No') : entry.type) + '</td>';
        html += '<td style="padding:4px;">' + (entry.value !== undefined ? entry.value : '—') + '</td>';
        html += '<td style="padding:4px;">' + (entry.duration != null ? entry.duration + 'ms' : '—') + '</td>';
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('tab-slices').innerHTML = html;
    }

    // ─── Raw JSON Tab ─────────────────────────────────────────
    function renderRawTab(data) {
      document.getElementById('tab-raw').innerHTML = '<pre class="json-view">' + syntaxHighlight(JSON.stringify(data, null, 2)) + '</pre>';
    }

    // ─── Log ──────────────────────────────────────────────────
    function log(msg) {
      var el = document.getElementById('log-panel');
      el.innerHTML += '<div class="log-entry"><span class="log-time">' + new Date().toLocaleTimeString() + '</span> <span class="log-msg">' + msg + '</span></div>';
      el.scrollTop = el.scrollHeight;
    }

    // ─── Tab Switching ────────────────────────────────────────
    document.querySelectorAll('.tab').forEach(function(t) {
      t.addEventListener('click', function() {
        var tabName = t.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(function(tb) { tb.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(c) { c.style.display = 'none'; });
        t.classList.add('active');
        document.getElementById('tab-' + tabName).style.display = 'block';
      });
    });

    function togglePanel() {
      document.getElementById('data-panel').classList.toggle('hidden');
      if (document.getElementById('device-select').value !== 'desktop') {
        setTimeout(applyDevicePreview, 50);
      }
    }

    // ─── Device Preview ──────────────────────────────────────
    function applyDevicePreview() {
      var val = document.getElementById('device-select').value;
      var panel = document.getElementById('game-panel');
      if (val === 'desktop') {
        panel.classList.remove('device-preview');
        panel.style.removeProperty('--device-w');
        panel.style.removeProperty('--device-h');
        panel.style.removeProperty('--device-scale');
      } else {
        var parts = val.split('x');
        var devW = parseInt(parts[0], 10);
        var devH = parseInt(parts[1], 10);
        var availH = panel.clientHeight - 60;
        var availW = panel.clientWidth - 60;
        var scale = Math.min(1, availH / (devH + 24), availW / (devW + 24));
        panel.classList.add('device-preview');
        panel.style.setProperty('--device-w', devW + 'px');
        panel.style.setProperty('--device-h', devH + 'px');
        panel.style.setProperty('--device-scale', scale.toFixed(3));
      }
      log('Device preview: ' + (val === 'desktop' ? 'off' : val));
    }

    document.getElementById('device-select').addEventListener('change', applyDevicePreview);
    window.addEventListener('resize', function() {
      if (document.getElementById('device-select').value !== 'desktop') applyDevicePreview();
    });

    function clearData() {
      lastResult = null;
      document.getElementById('tab-scores').innerHTML = '<div class="no-data">Waiting for game results...</div>';
      document.getElementById('tab-slices').innerHTML = '<div class="no-data">Waiting for game results...</div>';
      document.getElementById('tab-raw').innerHTML = '<div class="no-data">Waiting for game results...</div>';
      document.getElementById('log-panel').innerHTML = '';
    }

    // ─── Helpers ──────────────────────────────────────────────
    function scoreCard(label, value, highlight, full) {
      return '<div class="score-card' + (full ? ' full' : '') + '">' +
        '<div class="score-label">' + label + '</div>' +
        '<div class="score-value' + (highlight ? ' highlight' : ' muted') + '">' + (value !== null && value !== undefined ? value : '—') + '</div>' +
        '</div>';
    }

    function sectionTitle(text) {
      return '<div class="section-title">' + text + '</div>';
    }

    function syntaxHighlight(json) {
      json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      json = json.replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:');
      json = json.replace(/: "(.*?)"/g, ': <span class="json-string">"$1"</span>');
      json = json.replace(/: (\d+\.?\d*)/g, ': <span class="json-number">$1</span>');
      json = json.replace(/: (true|false)/g, ': <span class="json-bool">$1</span>');
      json = json.replace(/: (null)/g, ': <span class="json-null">null</span>');
      return json;
    }
  </script>
</body>
</html>
